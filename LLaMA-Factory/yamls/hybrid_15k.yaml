# Curated (hybrid) 15K run. Matches yamls/random_15k.yaml on everything that affects the learned model:
# Qwen2.5-3B-Instruct, full SFT, qwen template, cutoff 16384, 3 epochs, lr 5e-6 cosine, no warmup,
# batch 1 x grad-accum 8 (global 8), bf16, ZeRO-3.
# Speed-only differences: no CPU offload (curated samples are <= 8.1K tokens, fit on A100/H200), flash-attn 2.
# Resumable: full state saved every 200 steps; overwrite_output_dir false -> a restarted job continues
# automatically from the latest checkpoint. output_dir is set per GPU type by submit_hybrid.sh.

### model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: acereason_hybrid_15k
template: qwen
cutoff_len: 16384
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen25_3b_instruct/hybrid_15k
logging_steps: 1
save_strategy: steps
save_steps: 100
save_total_limit: 2
save_only_model: false
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
